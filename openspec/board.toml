# Planning metadata for every ACTIVE OpenSpec change (openspec/changes/<id>/).
# Language-neutral on purpose: everything here is an id, a path or an enum,
# so it lives once instead of once per language. The prose (title, area,
# why, requirements) lives in each change's proposal.md / proposal.pt-BR.md.
#
#   status        backlog | in-progress | review   (archived changes are Done)
#   branch        git branch that implements the change
#   depends_on    TASK ids that must be Done first
#   suitable_for  agent | both | human  -- see openspec/README.md
#   playbooks     .agents/skills/<name>/SKILL.md to read before starting
#
# docs/kanban.html is generated from this file plus the changes:
#   python3 scripts/openspec_to_kanban.py

