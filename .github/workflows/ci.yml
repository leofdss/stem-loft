name: CI

# The tool-neutral gate every change passes, whoever (or whatever) wrote it:
# scripts/verify.sh is the single definition of "green" (AGENTS.md,
# "Checks: what runs when"), plus Conventional Commits on every PR commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      OPENSPEC_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the commit-message check walks the PR's history

      - name: Conventional Commits (every commit in the PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_commit_msg.py --range "origin/${{ github.base_ref }}..HEAD"

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libasound2-dev pkg-config

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Full verification pass
        run: scripts/verify.sh
