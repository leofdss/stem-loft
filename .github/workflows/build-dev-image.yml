name: Build and publish dev image

# Publica a imagem de desenvolvimento (distrobox/Containerfile) no GitHub
# Container Registry (ghcr.io), pública -- para auditoria externa (projeto
# open source) e para servir de ambiente reprodutível de longo prazo.
#
# Gatilhos:
# - push na main que mude o Containerfile ou este workflow;
# - agendado semanalmente: o Arch é rolling release, então reconstruir toda
#   semana traz atualizações de segurança dos pacotes do sistema sem
#   depender de alguém lembrar de rebuildar manualmente;
# - workflow_dispatch, para rebuild manual sob demanda.
on:
  push:
    branches: [main]
    paths:
      - "distrobox/Containerfile"
      - ".github/workflows/build-dev-image.yml"
  schedule:
    - cron: "0 6 * * 1" # toda segunda-feira, 06:00 UTC
  workflow_dispatch: {}

env:
  IMAGE_NAME: stem-player-dev
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Normalizar nome do owner (minúsculas, exigido pelo GHCR)
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" --password-stdin

      - name: Build da imagem
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.IMAGE_NAME }}"
          podman build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.sha_short }}" \
            -f distrobox/Containerfile .

      - name: Push da imagem
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.IMAGE_NAME }}"
          podman push "$IMAGE:latest"
          podman push "$IMAGE:${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.sha_short }}"
