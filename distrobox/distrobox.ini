# StemLoft development container, declared for `distrobox assemble`.
#
# Create it (from the repository root):
#
#   distrobox assemble create --file distrobox/distrobox.ini
#   distrobox enter stemloft
#
# The point of declaring the container here instead of typing a long
# `distrobox create` by hand: the environment is described in the repo,
# reviewable in a diff, and identical for everyone who runs the command --
# the same reasoning behind publishing the image (see README.md).
#
# `assemble create` is not destructive: if a container named `stemloft`
# already exists, it prints "stemloft already exists" and leaves it alone.
# To rebuild it from scratch (e.g. after a new image is published), pass
# `--replace`, which deletes the container and recreates it. Only the
# container is thrown away -- the work lives in the host's HOME, which is
# shared, not inside the container.
[stemloft]

# The image published by this repo's workflow
# (.github/workflows/build-dev-image.yml). To test a locally built image
# instead, build it as described in README.md and point this at
# `localhost/stemloft-dev:latest`.
image=ghcr.io/leofdss/stemloft-dev:latest

# Always check the registry for a newer `latest` when creating the
# container. The image is rebuilt weekly (Arch is a rolling release), so
# recreating it with `--replace` picks up those rebuilds instead of
# silently reusing a months-old local copy.
pull=true

# Run `distrobox-init` right after creating it -- the first entry is the
# slow one (it creates the user, sets up sudo, links the sockets below), so
# do it at creation time instead of making the first `distrobox enter` pay
# for it.
start_now=true

# No .desktop entry in the host's application menu. This is a development
# container entered from a terminal, not an app. (VS Code and any other
# GUI app that should show up in the host menu can be exported per user,
# from inside the container, with `distrobox-export --app code` -- that's a
# user preference, not a property of the environment.)
entry=false

# No systemd inside the container: nothing here is a service, and `--init`
# makes Distrobox skip mounting the host's XDG_RUNTIME_DIR -- which is
# exactly where the Wayland, PipeWire, and PulseAudio sockets that the
# Tauri WebView and the audio engine need live.
init=false

# No GPU passthrough. StemLoft is an audio app: the WebView renders through
# the regular GTK/WebKit stack, and nothing in the core needs CUDA/NVENC.
# (If automatic stem separation is ever run locally instead of through an
# external API, that's the moment to revisit this.)
nvidia=false

# No extra volumes, deliberately. Distrobox already mounts, with no
# configuration:
#   - the host's HOME (so the repository, ~/.gitconfig, and ~/.claude are
#     the same files inside and outside -- the sharing the Containerfile
#     depends on, see README.md);
#   - /dev and /sys (so /dev/snd reaches ALSA/cpal), plus the host's
#     supplementary groups (`audio`, `video`, ...);
#   - the XDG_RUNTIME_DIR sockets: Wayland/X11 for the WebView, and
#     PipeWire/PulseAudio for playback;
#   - the whole host filesystem read/write under /run/host, for anything
#     outside HOME (e.g. stems stored on another mount point).
# A `volume=` line is only needed for a path that must appear at the *same*
# path inside the container as on the host.

# No `additional_packages` either: every tool belongs in the Containerfile,
# where it's part of the published, auditable image. Installing packages
# from here would make each developer's container quietly different from
# the image everyone else pulls.
