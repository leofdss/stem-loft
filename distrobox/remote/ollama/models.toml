# Which local model does which kind of work -- read by scripts/local_llm.py
# and by distrobox/remote/ollama/install.sh (pulls every role with pull = true).
#
# Defaults sized for a GPU with ~8 GB of VRAM. Change a role's model here
# for your hardware, re-run install.sh, and every caller follows -- nobody
# hardcodes a model. Record what you measure on your own host in
# distrobox/remote/lab.local.md (gitignored).
#
# Only hand a local model work with a mechanical check behind it (a test,
# cargo check, tsc, the bilingual parity checker...). See AGENTS.md,
# "Choosing who does the work".

[roles.quick]
# Same model as `translate` on purpose: one model stays loaded in VRAM.
# Avoid thinking-only tags here: they ignore think=false and ramble.
model = "qwen3:8b"
use = "Commit messages, PR summaries, classifying a diff, short rewrites."
think = false
pull = true

[roles.code]
# Fits fully in ~8 GB with 16k context. Never let one model write both the
# code and the test that judges it.
model = "qwen2.5-coder:7b"
use = "Mechanical code edits and test scaffolding gated by cargo check / tsc / tests."
think = false
pull = true
# Sent with every request; 16k fits the whole model + KV cache in VRAM.
options = { num_ctx = 16384, temperature = 0.2, num_predict = 8192 }

[roles.translate]
model = "qwen3:8b"
use = "EN <-> pt-BR drafts of docs and OpenSpec artifacts, checked by check_bilingual_parity.py and reviewed by a human."
think = false
pull = true

[roles.heavy]
model = "qwen3-coder:30b"
use = "Longer agentic sessions over a bigger context (e.g. driven by an agent CLI pointed at this server). MoE with 3B active: on an 8 GB GPU most of it lives in RAM, so it is slower than `code`, especially at reading long prompts."
think = false
pull = true
options = { num_ctx = 16384, temperature = 0.2, num_predict = 8192 }
